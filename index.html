<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f13">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NestFlow</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f0f1f4; --border:#e3e5ea;
  --text:#16181d; --muted:#6b7280; --accent:#7c6fcd; --purple:#a78bfa;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb;
  --safe-bottom:env(safe-area-inset-bottom,0px); --safe-top:env(safe-area-inset-top,0px);
  --radius:16px; --shadow:0 2px 10px rgba(20,24,40,.06);
}
:root[data-theme="dark"]{
  --bg:#0f0f13; --surface:#191922; --surface2:#22222e; --border:#2c2c3a;
  --text:#f0f0f4; --muted:#9a9aae; --accent:#8b7fd9; --purple:#a78bfa;
  --green:#3ecf8e; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa;
  --shadow:0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;padding-bottom:calc(78px + var(--safe-bottom));-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-weight:700;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;font-size:15px;}
.app-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(12px + var(--safe-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;}
.app-header .logo{font-size:20px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;}
.app-header .logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow);}
.wrap{padding:0 16px;max-width:640px;margin:0 auto;}
.view{display:none;animation:fade .25s;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.card.tap{cursor:pointer;transition:transform .12s;}
.card.tap:active{transform:scale(.985);}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 10px;}
.row{display:flex;align-items:center;gap:12px;}
.spread{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--muted);}.small{font-size:13px;}.tiny{font-size:11px;}
.big-num{font-size:30px;font-weight:800;letter-spacing:-1px;}
.pos{color:var(--green);}.neg{color:var(--red);}.warn{color:var(--amber);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.badge.bett{background:#8b5cf622;color:#8b5cf6;}
.badge.card{background:#ef444422;color:#ef4444;}
.badge.aside{background:#9a9aae22;color:var(--muted);}
.badge.paused{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted);}
.hero{background:linear-gradient(150deg,var(--accent),var(--purple));color:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);}
.hero .two{display:flex;gap:12px;}
.hero .two > div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:12px;}
.hero .two .k{font-size:12px;opacity:.9;font-weight:600;}
.hero .two .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:2px;}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.lrow:last-child{border-bottom:none;}
.lrow .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.lrow .nm{font-weight:600;}.lrow .sub{font-size:12px;color:var(--muted);}
.lrow .amt{margin-left:auto;font-weight:700;white-space:nowrap;}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all .15s;}
.chk.on{background:var(--green);border-color:var(--green);}
.catbar{height:7px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:8px;}
.catbar > span{display:block;height:100%;border-radius:999px;}
.expand{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.expand.open{max-height:2000px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--text);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;}
.btn.full{width:100%;}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;}
.btn.danger{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red);}
.fab{position:fixed;right:18px;bottom:calc(86px + var(--safe-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 50%,transparent);z-index:40;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(66px + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:stretch;z-index:35;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;padding-top:8px;}
.nav-item .ni{font-size:19px;line-height:1;}
.nav-item.active{color:var(--accent);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-bg.show{opacity:1;pointer-events:auto;}
.modal{background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + var(--safe-bottom));max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.34,1.2,.5,1);}
.modal-bg.show .modal{transform:none;}
.modal h2{font-size:19px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;padding:11px;border-radius:11px;background:var(--surface2);font-weight:700;font-size:13px;border:1.5px solid transparent;min-width:80px;}
.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(90px + var(--safe-bottom));background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:all .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.editnum{width:92px;text-align:right;padding:8px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-weight:700;}
.switch{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0;}
.switch.on{background:var(--green);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
.switch.on::after{left:21px;}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;}
.notif{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(217,119,6,.35);}
.notif .t{font-weight:800;font-size:15px;}
.mini-hist{font-size:12px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--border);}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.qtot{display:flex;justify-content:space-between;font-weight:800;padding-top:10px;border-top:2px solid var(--border);margin-top:6px;}
</style>
</head>
<body>

<div class="app-header">
  <div class="logo"><span class="dot"></span>NestFlow</div>
  <div class="row" style="gap:8px">
    <button class="icon-btn" onclick="openMonthPicker()" id="monthBtn" style="width:auto;min-width:38px;padding:0 12px;font-size:13px;font-weight:700;white-space:nowrap">📅</button>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </div>
</div>

<div class="wrap">
  <div class="view active" id="v-inicio"><div id="inicioBody"></div></div>
  <div class="view" id="v-tarjeta"><div id="tarjetaBody"></div></div>
  <div class="view" id="v-betterment"><div id="bettBody"></div></div>
  <div class="view" id="v-presupuesto"><div id="presuBody"></div></div>
  <div class="view" id="v-ahorros"><div id="ahorrosBody"></div></div>
</div>

<button class="fab" onclick="openTxModal()">+</button>

<nav class="bottom-nav">
  <button class="nav-item active" data-view="inicio" onclick="go('inicio')"><span class="ni">🏠</span>Inicio</button>
  <button class="nav-item" data-view="tarjeta" onclick="go('tarjeta')"><span class="ni">💳</span>Tarjeta</button>
  <button class="nav-item" data-view="betterment" onclick="go('betterment')"><span class="ni">💜</span>Betterment</button>
  <button class="nav-item" data-view="presupuesto" onclick="go('presupuesto')"><span class="ni">📋</span>Presupuesto</button>
  <button class="nav-item" data-view="ahorros" onclick="go('ahorros')"><span class="ni">🐷</span>Ahorros</button>
</nav>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const money = n => (n<0?'-':'')+'$'+Math.abs(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => (n<0?'-':'')+'$'+Math.abs(Math.round(n||0)).toLocaleString('en-US');
const todayStr = () => new Date().toISOString().slice(0,10);
const monthOf = d => (d||'').slice(0,7);
const uid = () => Date.now()+Math.floor(Math.random()*9999);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2100);}

/* ---------- Storage ---------- */
function loadData(){try{return JSON.parse(localStorage.getItem('fh_data')||'null');}catch(e){return null;}}
function saveData(){localStorage.setItem('fh_data',JSON.stringify(DATA));}
function loadCats(){try{return JSON.parse(localStorage.getItem('fh_cats')||'null');}catch(e){return null;}}
function saveCats(){localStorage.setItem('fh_cats',JSON.stringify(CATS));}
function loadFixed(){try{return JSON.parse(localStorage.getItem('fh_fixed')||'null');}catch(e){return null;}}
function saveFixed(){localStorage.setItem('fh_fixed',JSON.stringify(FIXED));}
function loadPrefs(){try{return JSON.parse(localStorage.getItem('fh_prefs')||'null')||{};}catch(e){return {};}}
function savePrefs(){localStorage.setItem('fh_prefs',JSON.stringify(PREFS));}

const DEFAULT_CATS=[
 {name:'Supermercado & Salidas',color:'#7c6fcd',icon:'🛒'},{name:'Facturas',color:'#60a5fa',icon:'🧾'},
 {name:'Otros',color:'#3ecf8e',icon:'📦'},{name:'Gas',color:'#fbbf24',icon:'⛽'},
 {name:'Savannah',color:'#f472b6',icon:'🐾'},{name:'Vacaciones',color:'#2dd4bf',icon:'✈️'},
 {name:'Servicios Médicos',color:'#fb923c',icon:'🏥'},{name:'Carro & Mantenimiento',color:'#84cc16',icon:'🚗'},
];
/* Budget oficial (de tu hoja del Drive). q = quincena (15 o 30). */
const BUDGET=[
 {id:'b1',name:'Car Insurance',amount:125,day:15,payTo:'Betterment',q:15},
 {id:'b2',name:'Mint Mobile',amount:55,day:15,payTo:'Betterment',q:15},
 {id:'b3',name:'Car Maintenance',amount:100,day:15,payTo:'Betterment',q:15},
 {id:'b4',name:'Savi',amount:100,day:15,payTo:'Betterment',q:15},
 {id:'b5',name:'Immigration Fees',amount:250,day:15,payTo:'Betterment',q:15},
 {id:'b6',name:'House Downpayment',amount:100,day:15,payTo:'Betterment',q:15},
 {id:'b7',name:'Medical Cash',amount:100,day:15,payTo:'Betterment',q:15},
 {id:'b8',name:'Emergency Funds',amount:100,day:15,payTo:'Betterment',q:15},
 {id:'b9',name:'Food & Essentials',amount:600,day:15,payTo:'Wells Fargo',q:15},
 {id:'b10',name:'Sewer',amount:50,day:11,payTo:'Wells Fargo',q:15},
 {id:'b11',name:'Mediacom',amount:96,day:15,payTo:'Wells Fargo',q:15},
 {id:'b12',name:'Extra Expenses',amount:100,day:1,payTo:'Wells Fargo',q:15},
 {id:'b13',name:'Spotify',amount:18.99,day:27,payTo:'Wells Fargo',q:15},
 {id:'b14',name:'Disney bundle',amount:20.36,day:20,payTo:'Amex',q:15},
 {id:'b15',name:'Gym',amount:29,day:17,payTo:'Wells Fargo',q:15},
 {id:'b16',name:'Subaru',amount:530,day:20,payTo:'Checking',q:15},
 {id:'b17',name:'SoloTV',amount:15,day:29,payTo:'Bank of america',q:15},
 {id:'b18',name:'Mama y Papa',amount:300,day:15,payTo:'Bank of america',q:15},
 {id:'b19',name:'Water',amount:75,day:18,payTo:'Wells Fargo',q:15},
 {id:'b20',name:'Monthly Fee',amount:4.95,day:19,payTo:'Bank of america',q:15},
 {id:'b21',name:'AT&T',amount:46,day:15,payTo:'Bank of america',q:15},
 {id:'b22',name:'Allowance Luis',amount:100,day:15,payTo:'Bank of america',q:15},
 {id:'b23',name:'Babysitter',amount:600,day:15,payTo:'Regions',q:15},
 {id:'b24',name:'House Payment',amount:220,day:15,payTo:'Betterment',q:15},
 {id:'b25',name:'Allowance Monica',amount:100,day:15,payTo:'Regions',q:15},
 {id:'b26',name:'Car Insurance',amount:125,day:1,payTo:'Betterment',q:30},
 {id:'b27',name:'Food & Essentials',amount:600,day:1,payTo:'Wells Fargo',q:30},
 {id:'b28',name:'Compassion',amount:93,day:25,payTo:'Wells Fargo',q:30},
 {id:'b29',name:'Ameren',amount:300,day:28,payTo:'Wells Fargo',q:30,variable:true},
 {id:'b30',name:'Emergency Funds',amount:100,day:1,payTo:'Wells Fargo',q:30},
 {id:'b31',name:'Gas',amount:200,day:1,payTo:'Wells Fargo',q:30},
 {id:'b32',name:'Offering',amount:150,day:30,payTo:'Checking',q:30},
 {id:'b33',name:'Philipines',amount:670,day:30,payTo:'Checking',q:30},
 {id:'b34',name:'Rent',amount:860,day:2,payTo:'Checking',q:30},
 {id:'b35',name:'Babysitter',amount:600,day:30,payTo:'Regions',q:30},
 {id:'b36',name:'Daniel',amount:50,day:5,payTo:'Bank of america',q:30},
 {id:'b37',name:'Netflix',amount:27,day:27,payTo:'Wells Fargo',q:30},
];
// A qué bucket de ahorro alimenta un fijo de Betterment (si aplica)
const BUCKET_MAP={'Car Insurance':'Car Insurance','Mint Mobile':'Mint Mobile','Car Maintenance':'Car Maintenance','Savi':'Savi','Immigration Fees':'Immigration Fees','House Downpayment':'House Downpayment','Medical Cash':'Medical Cash','Emergency Funds':'Emergency Fund','House Payment':'House Payment'};

let DATA = loadData() || {transactions:[],savings:{},income:{},incomeHistory:[],accounts:{},budgetsDefault:{},betLog:[]};
let CATS = loadCats() || DEFAULT_CATS.slice();
let FIXED = loadFixed() || [];
let PREFS = loadPrefs();
if(!PREFS.theme) PREFS.theme='dark';
DATA.transactions=DATA.transactions||[]; DATA.savings=DATA.savings||{}; DATA.incomeHistory=DATA.incomeHistory||[];
DATA.accounts=DATA.accounts||{}; DATA.budgetsDefault=DATA.budgetsDefault||{}; DATA.betLog=DATA.betLog||[];
let VIEW_MONTH = monthOf(todayStr());

/* ================= MIGRACIONES ================= */
function migrate(){
  let ch=false;
  // Cuentas: Betterment (efectivo) + Wells Fargo (tarjeta). Resto no se rastrea.
  if(!DATA.accounts['Betterment']) DATA.accounts['Betterment']={balance:0,type:'checking',color:'#8b5cf6'};
  if(DATA.accounts['Wells Fargo']) DATA.accounts['Wells Fargo'].type='credit';
  // Zeroing de Betterment (v2) — dejar en $0 con el ingreso recibido no registrado
  DATA.incomeHistory=DATA.incomeHistory.filter(x=>x.note!=='Ajuste ingreso auto');
  if(!localStorage.getItem('fh_bett_zero_v2')){
    const bal=+DATA.accounts['Betterment'].balance||0;
    if(bal<-0.5){
      const falta=Math.round(-bal*100)/100, a=Math.round(falta/2*100)/100, b=Math.round((falta-a)*100)/100;
      DATA.incomeHistory.push({who:'luis',amount:a,date:'2026-08-28',note:'Ingreso recibido (ajuste)'});
      DATA.incomeHistory.push({who:'luis',amount:b,date:'2026-09-10',note:'Ingreso recibido (ajuste)'});
      DATA.accounts['Betterment'].balance=0; ch=true;
    }
    localStorage.setItem('fh_bett_zero_v2','1');
  }
  // v3: cargar la lista de fijos oficial del budget (una vez)
  if(!localStorage.getItem('fh_budget_v3')){
    FIXED = BUDGET.map(b=>({...b, group:groupOf(b.payTo), active:true}));
    saveFixed();
    localStorage.setItem('fh_budget_v3','1'); ch=true;
  } else {
    // asegurar campos
    FIXED.forEach(f=>{ if(!f.group){f.group=groupOf(f.payTo||'Wells Fargo');ch=true;} if(f.active===undefined){f.active=true;ch=true;} });
  }
  // v4: limpiar los fijos que se auto-generaron por error (duplicados como Netflix ya pagado)
  if(!localStorage.getItem('fh_clean_v4')){
    const before=DATA.transactions.length;
    DATA.transactions=DATA.transactions.filter(t=>t.note!=='Fijo tarjeta'&&t.note!=='Factura fija');
    if(DATA.transactions.length!==before) ch=true;
    localStorage.setItem('fh_clean_v4','1');
  }
  if(ch){ saveData(); saveFixed(); }
}
function groupOf(payTo){ if(payTo==='Betterment')return 'bett'; if(payTo==='Wells Fargo'||payTo==='WF')return 'card'; return 'aside'; }
migrate();

/* ================= MOTOR DE DINERO ================= */
function bettBal(){ return +(DATA.accounts?.Betterment?.balance||0); }
function isCard(src){ return src==='Wells Fargo'||src==='WF'; }
function wfPending(){ return DATA.transactions.filter(t=>t.type!=='income'&&t.status!=='paid'&&(isCard(t.source)||!t.source)); }
function wfOwed(){ return wfPending().reduce((s,t)=>s+(+t.amount||0),0); }
function paySources(){ const b=Object.keys(DATA.savings||{}); const first=['Betterment','Food Reserve','Gas Reserve'].filter(x=>x==='Betterment'||b.includes(x)); const rest=b.filter(x=>!first.includes(x)); return [...first,...rest,'Regions']; }
function _bl(desc,amount){ (DATA.betLog=DATA.betLog||[]).push({date:todayStr(),desc,amount:Math.round(amount*100)/100}); }
function deductSource(src,amt,note){
  if(src==='Betterment'){ DATA.accounts.Betterment.balance=bettBal()-amt; _bl(note||'Gasto',-amt); return; }
  if(DATA.savings[src]){ const b=DATA.savings[src]; b.total=(+b.total||0)-amt; (b.history=b.history||[]).push({date:todayStr(),amount:-amt,note:note||'Pago'}); }
}
function addSource(src,amt,note){
  if(src==='Betterment'){ DATA.accounts.Betterment.balance=bettBal()+amt; _bl(note||'Ingreso',amt); return; }
  if(DATA.savings[src]){ const b=DATA.savings[src]; b.total=(+b.total||0)+amt; (b.history=b.history||[]).push({date:todayStr(),amount:amt,note:note||'Reverso'}); }
}
function savingsTotal(){ return Object.values(DATA.savings).reduce((s,b)=>s+(+b.total||0),0); }

/* Cargos fijos de tarjeta → generar como pendientes del mes */
function generateCardForMonth(mk){
  let n=0;
  FIXED.filter(f=>f.active&&f.group==='card').forEach(f=>{
    if(DATA.transactions.some(t=>monthOf(t.date)===mk&&(t.name||'').toLowerCase()===f.name.toLowerCase())) return;
    const day=String(Math.min(f.day||1,28)).padStart(2,'0');
    DATA.transactions.push({id:uid(),name:f.name,amount:+f.amount||0,category:catForFixed(f.name),source:'Wells Fargo',date:mk+'-'+day,type:'expense',status:'pending',fixedId:f.id,note:'Fijo tarjeta'});
    n++;
  });
  if(n) saveData();
  return n;
}
function catForFixed(name){ const l=name.toLowerCase(); if(l.includes('food')||l.includes('essential'))return 'Supermercado & Salidas'; if(l.includes('gas'))return 'Gas'; return 'Facturas'; }
/* Fijos de Betterment por confirmar este mes */
// (Los fijos NO se auto-generan como cargos. Tú registras tus compras reales.)
// Los aportes a fondos SÍ son automáticos: salen solos de Betterment cada quincena.
function bettFillDay(f){ return f.q===30?1:15; } // Q30 se aparta el día 1, Q15 el día 15
function bettAppliedThisMonth(mk){ return FIXED.filter(f=>f.active&&f.group==='bett'&&localStorage.getItem('fh_auto_'+mk+'_'+f.id)); }
function bettUpcoming(mk){ const day=(mk===monthOf(todayStr()))?new Date().getDate():0; return FIXED.filter(f=>f.active&&f.group==='bett'&&!localStorage.getItem('fh_auto_'+mk+'_'+f.id)&&day<bettFillDay(f)); }
function autoTransferBuckets(){
  const mk=monthOf(todayStr()), day=new Date().getDate(); let applied=[];
  FIXED.filter(f=>f.active&&f.group==='bett').forEach(f=>{ const key='fh_auto_'+mk+'_'+f.id; if(localStorage.getItem(key))return; if(day<bettFillDay(f))return;
    const amt=+f.amount||0; deductSource('Betterment',amt,'Apartado: '+f.name);
    const bk=BUCKET_MAP[f.name]; if(bk&&DATA.savings[bk]){ DATA.savings[bk].total=(+DATA.savings[bk].total||0)+amt; (DATA.savings[bk].history=DATA.savings[bk].history||[]).push({date:todayStr(),amount:amt,note:'Auto apartado'}); }
    localStorage.setItem(key,'1'); applied.push({id:f.id,name:f.name,amount:amt}); });
  if(applied.length) saveData();
  return applied;
}
function undoAuto(id){ const mk=monthOf(todayStr()); const f=FIXED.find(x=>x.id===id); if(!f)return; const key='fh_auto_'+mk+'_'+id; if(!localStorage.getItem(key))return;
  const amt=+f.amount||0; addSource('Betterment',amt,'Deshacer: '+f.name);
  const bk=BUCKET_MAP[f.name]; if(bk&&DATA.savings[bk]){ DATA.savings[bk].total=(+DATA.savings[bk].total||0)-amt; (DATA.savings[bk].history=DATA.savings[bk].history||[]).push({date:todayStr(),amount:-amt,note:'Deshacer'}); }
  localStorage.removeItem(key); saveData(); render(); toast('Deshecho'); }
autoTransferBuckets();

function toggleCat(el){ const ex=el.parentElement.querySelector('.expand'); ex.classList.toggle('open'); el.querySelector('.arrow').textContent=ex.classList.contains('open')?'▴':'▾'; }
function togglePay(id){ selPay.has(id)?selPay.delete(id):selPay.add(id); renderTarjeta(); }
function selectAllPay(){ const p=wfPending(); if(selPay.size)selPay.clear(); else p.forEach(t=>selPay.add(t.id)); renderTarjeta(); }
function paySelected(){ const ids=selPay.size?[...selPay]:wfPending().map(t=>t.id); if(!ids.length){toast('Nada seleccionado');return;} openPayModal(ids); }
function payWFCard(){ const ids=wfPending().map(t=>t.id); if(!ids.length){toast('Nada que pagar');return;} openPayModal(ids); }
function defaultSource(cat){
  if(cat==='Supermercado & Salidas'&&DATA.savings['Food Reserve'])return 'Food Reserve';
  if(cat==='Gas'&&DATA.savings['Gas Reserve'])return 'Gas Reserve';
  if(cat==='Savannah')return 'Regions';
  return 'Betterment';
}
function srcOpts(sel){ return paySources().map(s=>{ const bal = s==='Betterment'?bettBal():(DATA.savings[s]?+DATA.savings[s].total||0:null); return `<option value="${s}" ${s===sel?'selected':''}>${s}${bal!=null?(' · '+money(bal)):''}</option>`; }).join(''); }
function openPayModal(ids){
  const items=DATA.transactions.filter(t=>ids.includes(t.id)&&t.status!=='paid'); if(!items.length){toast('Nada por pagar');return;}
  const total=items.reduce((s,t)=>s+(+t.amount||0),0);
  const groups={}; items.forEach(t=>{(groups[t.category]=groups[t.category]||[]).push(t);});
  let body=`<h2>Pagar ${items.length} · ${money(total)}</h2>
    <div class="small muted" style="margin-bottom:14px">Elige de dónde sale el dinero de cada categoría.</div>`;

    body+=`<div class="field"><label>${ci.icon} ${cat} · ${money(sub)} (${its.length})</label>
      <select data-cat="${encodeURIComponent(cat)}">${srcOpts(defaultSource(cat))}</select></div>`; });
  body+=`<button class="btn primary full" onclick='doPay(${JSON.stringify(ids)})'>Confirmar pago</button>`;

function doPay(ids){
  const sel={}; document.querySelectorAll('#modalBox select[data-cat]').forEach(s=>{ sel[decodeURIComponent(s.dataset.cat)]=s.value; });
  let n=0,tot=0;
  DATA.transactions.forEach(t=>{ if(ids.includes(t.id)&&t.status!=='paid'){ const src=sel[t.category]||'Betterment'; t.status='paid'; t.paidDate=todayStr(); t.paySource=src; deductSource(src,+t.amount||0,'Pago '+(t.name||'')); n++; tot+=(+t.amount||0);} });
  selPay.clear(); saveData(); closeModal(); render(); toast(n+' pagado · '+money(tot));
}
function reverseTxMoney(t){ if(t.status==='paid') addSource(t.paySource||'Betterment',+t.amount||0,'Reverso '+(t.name||'')); }
function applyTxMoney(t){ if(t.status==='paid') deductSource(t.paySource||'Betterment',+t.amount||0,'Pago '+(t.name||'')); }

  saveData(); closeModal(); render(); toast('Ingreso guardado · entró a Betterment');
}
function delIncome(idx){ if(!confirm('¿Eliminar este ingreso?'))return; const x=DATA.incomeHistory[idx]; DATA.accounts.Betterment.balance=bettBal()-(+x.amount||0); DATA.incomeHistory.splice(idx,1); saveData(); closeModal(); render(); toast('Eliminado'); }

/* ================= PRESUPUESTO (por quincena) ================= */
function acctBadge(payTo){ const g=groupOf(payTo); const cls=g==='bett'?'bett':g==='card'?'card':'aside'; return `<span class="badge ${cls}">${payTo}</span>`; }
function renderPresu(){
  let h=`<div class="small muted" style="margin:6px 2px 14px">Tu presupuesto fijo, igual que tu hoja del Drive. Toca cualquier renglón para editar el monto, el día o pausarlo.</div>`;
  [15,30].forEach(q=>{
    const items=FIXED.filter(f=>f.q===q).sort((a,b)=>(a.day||0)-(b.day||0));
    const tot=items.filter(f=>f.active).reduce((s,f)=>s+(+f.amount||0),0);
    h+=`<div class="section-title">Quincena del ${q}</div><div class="card">`;
    if(!items.length) h+=`<div class="empty">Sin fijos.</div>`;
    items.forEach(f=>{ h+=`<div class="lrow" onclick="openFixedModal('${f.id}')">
      <div style="flex:1"><div class="nm small ${f.active?'':'muted'}">${f.name} ${f.variable?'<span class="badge aside">varía</span>':''} ${f.active?'':'<span class="badge paused">pausado</span>'}</div>
        <div class="sub">Día ${f.day} · ${acctBadge(f.payTo)}</div></div>
      <div class="amt ${f.active?'':'muted'}">${f.variable?'~':''}${money(+f.amount)}</div></div>`; });
    h+=`<div class="qtot"><span>Total quincena ${q}</span><span>${money(tot)}</span></div></div>`;
  });
  h+=`<button class="btn primary full" onclick="openFixedModal()">+ Nuevo gasto fijo</button>
    <div class="tiny muted" style="text-align:center;margin-top:10px">Solo referencia — como tu hoja del Drive. Tus gastos reales se registran en Tarjeta. Betterment = te sale como notificación para apartar/confirmar.</div>`;
  $('#presuBody').innerHTML=h;
}
function openFixedModal(id){
  const ed=id!=null; const f=ed?FIXED.find(x=>x.id===id):{name:'',amount:'',day:15,payTo:'Wells Fargo',q:15,active:true};
  const accts=['Betterment','Wells Fargo','Checking','Bank of america','Amex','Regions'];
  modal(`<h2>${ed?'Editar':'Nuevo'} gasto fijo</h2>
    <div class="field"><label>Nombre</label><input id="fxN" value="${f.name||''}"></div>
    <div class="field"><label>Monto</label><input id="fxA" type="number" step="0.01" value="${f.amount}"></div>
    <div class="field"><label>Día</label><input id="fxDay" type="number" min="1" max="31" value="${f.day||15}"></div>
    <div class="field"><label>Sale de</label><select id="fxAcc">${accts.map(a=>`<option ${a===f.payTo?'selected':''}>${a}</option>`).join('')}</select></div>
    <div class="field"><label>Quincena</label><div class="seg" id="fxQ">
      <button class="${f.q===15?'on':''}" data-v="15" onclick="pick('fxQ',this)">Día 15</button>
      <button class="${f.q===30?'on':''}" data-v="30" onclick="pick('fxQ',this)">Día 30</button></div></div>
    <div class="field"><label>¿El monto varía?</label><div class="row"><div class="switch ${f.variable?'on':''}" id="fxVar" onclick="this.classList.toggle('on')"></div><span class="small muted">Actívalo si cambia cada mes (ej. Ameren)</span></div></div>
    ${ed?`<div class="field"><label>Activo</label><div class="row"><div class="switch ${f.active?'on':''}" id="fxAct" onclick="this.classList.toggle('on')"></div><span class="small muted">Apágalo para pausar sin borrar</span></div></div>`:''}
    <button class="btn primary full" onclick="saveFixedItem(${ed?JSON.stringify(id):-1})">Guardar</button>
    ${ed?`<button class="btn danger full" style="margin-top:8px" onclick="delFixed('${id}')">Eliminar</button>`:''}`);
}
function saveFixedItem(id){
  const name=$('#fxN').value.trim(); if(!name){toast('Ponle nombre');return;}
  const amount=+$('#fxA').value||0, day=Math.min(31,Math.max(1,+$('#fxDay').value||15));
  const payTo=$('#fxAcc').value, q=+($('#fxQ .on')?.dataset.v||15), variable=$('#fxVar')?.classList.contains('on')||false;
  if(id!==-1&&id!=null){ const f=FIXED.find(x=>x.id===id); const act=$('#fxAct'); Object.assign(f,{name,amount,day,payTo,q,variable,group:groupOf(payTo),active:act?act.classList.contains('on'):f.active}); }
  else{ FIXED.push({id:'fx'+uid(),name,amount,day,payTo,q,variable,group:groupOf(payTo),active:true}); }
  saveFixed(); closeModal(); render(); toast('Guardado ✓');
}
function delFixed(id){ if(!confirm('¿Eliminar este gasto fijo?'))return; FIXED=FIXED.filter(x=>x.id!==id); saveFixed(); closeModal(); render(); toast('Eliminado'); }

/* ================= AHORROS ================= */
function renderAhorros(){
  let h=`<div class="hero"><div class="k" style="opacity:.9;font-size:13px;font-weight:600">🐷 Total ahorrado</div>
    <div style="font-size:34px;font-weight:800;letter-spacing:-1px;margin:2px 0">${money(savingsTotal())}</div></div>`;
  const buckets=Object.entries(DATA.savings).sort((a,b)=>(b[1].total||0)-(a[1].total||0));
  if(!buckets.length) h+=`<div class="card"><div class="empty">Sin fondos.</div></div>`;
  buckets.forEach(([name,b])=>{ h+=`<div class="card" style="padding:0;overflow:hidden"><div class="row" style="padding:14px 16px;cursor:pointer" onclick="toggleCat(this)">
    <div class="ico" style="background:${(b.color||'#888')}22;color:${b.color||'#888'}">🐷</div>
    <div style="flex:1"><div class="nm">${name}</div><div class="sub">${b.monthly?('aporte '+money0(b.monthly)+'/mes'):'sin aporte fijo'}</div></div>
    <div class="amt">${money(+b.total||0)}</div><div style="margin-left:8px;color:var(--muted)" class="arrow">▾</div></div>
    <div class="expand"><div style="padding:0 16px 12px"><div class="row" style="gap:8px;margin:4px 0 10px">
      <button class="btn sm primary" onclick="addToBucket(${JSON.stringify(name)})">+ Apartar</button>
      <button class="btn sm" onclick="takeFromBucket(${JSON.stringify(name)})">− Sacar</button></div>`;
    (b.history||[]).slice().reverse().slice(0,10).forEach(x=>{ h+=`<div class="mini-hist spread"><span>${x.date} ${x.note?('· '+x.note):''}</span><span class="${x.amount<0?'neg':'pos'}">${money(x.amount)}</span></div>`; });
    if(!(b.history||[]).length) h+=`<div class="mini-hist muted">Sin movimientos.</div>`;
    h+=`</div></div></div>`; });
  h+=`<button class="btn full" onclick="openBucketModal()">+ Nuevo fondo</button>`;
  $('#ahorrosBody').innerHTML=h;
}
function addToBucket(name){ const v=prompt('¿Cuánto apartar a '+name+'? (sale de Betterment)'); const n=+v; if(!n)return; DATA.savings[name].total=(+DATA.savings[name].total||0)+n; (DATA.savings[name].history=DATA.savings[name].history||[]).push({date:todayStr(),amount:n,note:'Desde Betterment'}); deductSource('Betterment',n,'Ahorro '+name); saveData(); render(); toast('Apartado a '+name); }
function takeFromBucket(name){ const v=prompt('¿Cuánto sacar de '+name+'? (regresa a Betterment)'); const n=+v; if(!n)return; DATA.savings[name].total=(+DATA.savings[name].total||0)-n; (DATA.savings[name].history=DATA.savings[name].history||[]).push({date:todayStr(),amount:-n,note:'A Betterment'}); addSource('Betterment',n,'Retiro '+name); saveData(); render(); toast('Sacado de '+name); }
function openBucketModal(){ modal(`<h2>Nuevo fondo</h2><div class="field"><label>Nombre</label><input id="bkN"></div><div class="field"><label>Aporte mensual (opcional)</label><input id="bkM" type="number" step="0.01" value="0"></div><div class="field"><label>Monto inicial</label><input id="bkT" type="number" step="0.01" value="0"></div><button class="btn primary full" onclick="saveBucket()">Crear</button>`); }
function saveBucket(){ const n=$('#bkN').value.trim(); if(!n){toast('Ponle nombre');return;} const t=+$('#bkT').value||0; DATA.savings[n]={monthly:+$('#bkM').value||0,total:t,color:'#7c6fcd',history:t?[{date:todayStr(),amount:t,note:'Inicial'}]:[]}; saveData(); closeModal(); render(); toast('Fondo creado'); }

/* ================= TRANSACCIÓN ================= */
function openTxModal(id){
  const ed=id!=null; const t=ed?DATA.transactions.find(x=>x.id===id):{name:'',amount:'',category:CATS[0].name,source:'Wells Fargo',date:todayStr(),status:'pending'};
  const accs=['Wells Fargo','Betterment'];
  modal(`<h2>${ed?'Editar':'Nuevo'} gasto</h2>
    <div class="field"><label>Nombre</label><input id="txN" value="${t.name||''}" placeholder="Ej. Walmart"></div>
    <div class="field"><label>Monto</label><input id="txA" type="number" step="0.01" value="${t.amount}"></div>
    <div class="field"><label>Categoría</label><select id="txC">${CATS.map(c=>`<option ${c.name===t.category?'selected':''}>${c.icon} ${c.name}</option>`).join('')}</select></div>
    <div class="field"><label>Con qué (tarjeta o efectivo)</label><select id="txS">${accs.map(a=>`<option ${a===t.source?'selected':''}>${a}</option>`).join('')}</select></div>
    <div class="field"><label>Fecha</label><input id="txD" type="date" value="${t.date}"></div>
    <div class="field"><label>Estado</label><div class="seg" id="txSt">
      <button class="${t.status!=='paid'?'on':''}" data-v="pending" onclick="pick('txSt',this)">Por pagar</button>
      <button class="${t.status==='paid'?'on':''}" data-v="paid" onclick="pick('txSt',this)">Pagado</button></div></div>
    <button class="btn primary full" onclick="saveTx(${ed?JSON.stringify(id):-1})">Guardar</button>
    ${ed?`<button class="btn danger full" style="margin-top:8px" onclick="delTx(${JSON.stringify(id)})">Eliminar</button>`:''}`);
}
function saveTx(id){
  const name=$('#txN').value.trim(), amount=+$('#txA').value||0, category=$('#txC').value.replace(/^[^\s]+\s/,''), source=$('#txS').value, date=$('#txD').value||todayStr(), status=$('#txSt .on')?.dataset.v||'pending';
  if(!amount){toast('Pon un monto');return;}
  if(id!==-1&&id!=null){ const t=DATA.transactions.find(x=>x.id===id); reverseTxMoney(t); Object.assign(t,{name,amount,category,source,date,status,paidDate:status==='paid'?(t.paidDate||todayStr()):null}); if(status==='paid'&&!t.paySource)t.paySource='Betterment'; if(status!=='paid')t.paySource=null; applyTxMoney(t); }
  else{ const t={id:uid(),name,amount,category,source,date,type:'expense',status,paidDate:status==='paid'?todayStr():null,paySource:status==='paid'?'Betterment':null,note:''}; DATA.transactions.push(t); applyTxMoney(t); }
  saveData(); closeModal(); render(); toast('Guardado ✓');
}
function delTx(id){ if(!confirm('¿Eliminar este gasto?'))return; const t=DATA.transactions.find(x=>x.id===id); if(t)reverseTxMoney(t); DATA.transactions=DATA.transactions.filter(x=>x.id!==id); selPay.delete(id); saveData(); closeModal(); render(); toast('Eliminado'); }

/* ================= AJUSTES ================= */
function openSettings(){
  modal(`<h2>Ajustes</h2>
    <div class="field"><label>Tema</label><div class="seg" id="setTheme">
      <button class="${PREFS.theme==='light'?'on':''}" data-v="light" onclick="setTheme('light')">☀️ Claro</button>
      <button class="${PREFS.theme==='dark'?'on':''}" data-v="dark" onclick="setTheme('dark')">🌙 Oscuro</button></div></div>
    <div class="section-title" style="margin-left:0">Presupuestos por categoría</div>
    <div class="card" style="box-shadow:none;background:var(--surface2)">
    ${CATS.map(c=>`<div class="lrow"><div class="ico" style="background:${c.color}22;color:${c.color}">${c.icon}</div><div style="flex:1"><div class="nm small">${c.name}</div></div><input class="editnum" type="number" value="${DATA.budgetsDefault[c.name]||0}" onchange="setBudget(${JSON.stringify(c.name)},this.value)"></div>`).join('')}</div>
    <div class="section-title" style="margin-left:0">Categorías</div>
    <div class="card" style="box-shadow:none;background:var(--surface2)">
    ${CATS.map((c,i)=>`<div class="lrow"><div class="ico" style="background:${c.color}22;color:${c.color}">${c.icon}</div><div style="flex:1" onclick="openCatModal(${i})"><div class="nm small">${c.name}</div><div class="sub">Toca para editar</div></div><button class="btn sm" onclick="openCatModal(${i})">✏️</button></div>`).join('')}</div>
    <button class="btn full" onclick="openCatModal()">+ Nueva categoría</button>
    <div class="section-title" style="margin-left:0">Tarjeta Wells — límite</div>
    <div class="card" style="box-shadow:none;background:var(--surface2)">
      <div class="lrow"><div style="flex:1"><div class="nm small">Límite total</div></div><input class="editnum" type="number" value="${DATA.accounts['Wells Fargo']?.limit||0}" onchange="setWFLimit('limit',this.value)"></div>
      <div class="lrow"><div style="flex:1"><div class="nm small">Tu tope (self)</div></div><input class="editnum" type="number" value="${DATA.accounts['Wells Fargo']?.selfLimit||0}" onchange="setWFLimit('selfLimit',this.value)"></div></div>
    <div class="section-title" style="margin-left:0">Respaldo</div>
    <button class="btn full" onclick="exportBackup()">⬇️ Descargar respaldo</button>
    <label class="btn full" style="margin-top:8px;display:flex">⬆️ Importar respaldo<input type="file" accept="application/json" style="display:none" onchange="importBackup(event)"></label>
    <div class="tiny muted" style="text-align:center;margin-top:10px">NestFlow · datos en este dispositivo</div>`);
}
function setTheme(t){ PREFS.theme=t; savePrefs(); applyTheme(); document.querySelectorAll('#setTheme button').forEach(b=>b.classList.toggle('on',b.dataset.v===t)); }
function setBudget(c,v){ DATA.budgetsDefault[c]=+v||0; saveData(); render(); }
function setWFLimit(k,v){ if(!DATA.accounts['Wells Fargo'])DATA.accounts['Wells Fargo']={type:'credit',balance:0}; DATA.accounts['Wells Fargo'][k]=+v||0; saveData(); render(); toast('Guardado'); }
function applyTheme(){ document.documentElement.setAttribute('data-theme',PREFS.theme); document.querySelector('meta[name=theme-color]').content=PREFS.theme==='dark'?'#0f0f13':'#f4f5f7'; }
const CAT_COLORS=['#7c6fcd','#60a5fa','#3ecf8e','#fbbf24','#f472b6','#2dd4bf','#fb923c','#84cc16','#f87171','#a78bfa'];
function openCatModal(i){ const ed=i!=null; const c=ed?CATS[i]:{name:'',color:CAT_COLORS[CATS.length%CAT_COLORS.length],icon:'📦'};
  modal(`<h2>${ed?'Editar':'Nueva'} categoría</h2><div class="field"><label>Nombre</label><input id="ctN" value="${c.name}"></div><div class="field"><label>Ícono (emoji)</label><input id="ctI" value="${c.icon}" maxlength="2"></div><div class="field"><label>Color</label><input id="ctC" type="color" value="${c.color}" style="height:46px;padding:4px"></div><button class="btn primary full" onclick="saveCat(${ed?i:-1})">Guardar</button>${ed?`<button class="btn danger full" style="margin-top:8px" onclick="delCat(${i})">Eliminar</button>`:''}`); }
function saveCat(i){ const name=$('#ctN').value.trim(); if(!name){toast('Ponle nombre');return;} const icon=$('#ctI').value.trim()||'📦', color=$('#ctC').value;
  if(i>=0){ const old=CATS[i].name; CATS[i]={name,color,icon}; if(old!==name){ DATA.transactions.forEach(t=>{if(t.category===old)t.category=name;}); if(DATA.budgetsDefault[old]!=null){DATA.budgetsDefault[name]=DATA.budgetsDefault[old];delete DATA.budgetsDefault[old];} saveData(); } }
  else CATS.push({name,color,icon});
  saveCats(); closeModal(); openSettings(); render(); toast('Guardado'); }
function delCat(i){ const c=CATS[i]; if(DATA.transactions.some(t=>t.category===c.name)){ if(!confirm('Hay gastos en "'+c.name+'". ¿Eliminar de todos modos?'))return; } else if(!confirm('¿Eliminar "'+c.name+'"?'))return; CATS.splice(i,1); saveCats(); closeModal(); openSettings(); render(); toast('Eliminada'); }
function exportBackup(){ const blob=new Blob([JSON.stringify({version:'3.0',exportDate:new Date().toISOString(),data:DATA,cats:CATS,fixedPayments:FIXED,prefs:PREFS},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='NestFlow-backup-'+todayStr()+'.json'; a.click(); toast('Respaldo descargado'); }
function importBackup(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{ const b=JSON.parse(ev.target.result);
  if(b.data){ DATA=b.data; DATA.transactions=DATA.transactions||[]; DATA.savings=DATA.savings||{}; DATA.incomeHistory=DATA.incomeHistory||[]; DATA.accounts=DATA.accounts||{}; DATA.budgetsDefault=DATA.budgetsDefault||{}; DATA.betLog=DATA.betLog||[]; saveData(); }
  if(b.cats){CATS=b.cats;saveCats();} if(b.fixedPayments){FIXED=b.fixedPayments;saveFixed();} if(b.prefs){PREFS=Object.assign(PREFS,b.prefs);savePrefs();}
  migrate(); applyTheme(); closeModal(); render(); toast('Importado ✓'); }catch(err){ alert('Archivo inválido'); } }; r.readAsText(f); }

/* ---------- Month picker ---------- */
function openMonthPicker(){ const months=[...new Set(DATA.transactions.map(t=>monthOf(t.date)).concat(DATA.incomeHistory.map(x=>monthOf(x.date))).concat([monthOf(todayStr())]))].filter(Boolean).sort().reverse();
  modal(`<h2>Ver mes</h2>${months.map(m=>`<button class="btn full ${m===VIEW_MONTH?'primary':''}" style="margin-bottom:8px" onclick="setMonth('${m}')">${new Date(m+'-01T00:00:00').toLocaleDateString('es',{month:'long',year:'numeric'})}</button>`).join('')}`); }
function setMonth(m){ VIEW_MONTH=m; closeModal(); render(); }

function modal(html){ $('#modalBox').innerHTML=html; $('#modalBg').classList.add('show'); }
function closeModal(){ $('#modalBg').classList.remove('show'); }
function pick(group,el){ document.querySelectorAll('#'+group+' button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }

applyTheme(); render();
</script>
</body>
</html>
