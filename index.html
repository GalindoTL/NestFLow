<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0f13">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<title>NestFlow</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface2:#f0f1f4; --border:#e3e5ea;
  --text:#16181d; --muted:#6b7280; --accent:#7c6fcd; --purple:#a78bfa;
  --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#2563eb;
  --safe-bottom:env(safe-area-inset-bottom,0px); --safe-top:env(safe-area-inset-top,0px);
  --radius:16px; --shadow:0 2px 10px rgba(20,24,40,.06);
}
:root[data-theme="dark"]{
  --bg:#0f0f13; --surface:#191922; --surface2:#22222e; --border:#2c2c3a;
  --text:#f0f0f4; --muted:#9a9aae; --accent:#8b7fd9; --purple:#a78bfa;
  --green:#3ecf8e; --red:#f87171; --amber:#fbbf24; --blue:#60a5fa;
  --shadow:0 4px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;padding-bottom:calc(78px + var(--safe-bottom));-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-weight:700;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;font-size:15px;}
.app-header{position:sticky;top:0;z-index:30;background:var(--bg);padding:calc(12px + var(--safe-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;}
.app-header .logo{font-size:20px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:7px;}
.app-header .logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow);}
.wrap{padding:0 16px;max-width:640px;margin:0 auto;}
.view{display:none;animation:fade .25s;}
.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
.card.tap{cursor:pointer;transition:transform .12s;}
.card.tap:active{transform:scale(.985);}
.section-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 10px;}
.row{display:flex;align-items:center;gap:12px;}
.spread{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--muted);}.small{font-size:13px;}.tiny{font-size:11px;}
.big-num{font-size:30px;font-weight:800;letter-spacing:-1px;}
.pos{color:var(--green);}.neg{color:var(--red);}.warn{color:var(--amber);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.badge.bett{background:#8b5cf622;color:#8b5cf6;}
.badge.card{background:#ef444422;color:#ef4444;}
.badge.aside{background:#9a9aae22;color:var(--muted);}
.badge.paused{background:color-mix(in srgb,var(--muted) 20%,transparent);color:var(--muted);}
.hero{background:linear-gradient(150deg,var(--accent),var(--purple));color:#fff;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent);}
.hero .two{display:flex;gap:12px;}
.hero .two > div{flex:1;background:rgba(255,255,255,.14);border-radius:14px;padding:12px;}
.hero .two .k{font-size:12px;opacity:.9;font-weight:600;}
.hero .two .v{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.stat{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:2px;}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.lrow:last-child{border-bottom:none;}
.lrow .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.lrow .nm{font-weight:600;}.lrow .sub{font-size:12px;color:var(--muted);}
.lrow .amt{margin-left:auto;font-weight:700;white-space:nowrap;}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:all .15s;}
.chk.on{background:var(--green);border-color:var(--green);}
.catbar{height:7px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-top:8px;}
.catbar > span{display:block;height:100%;border-radius:999px;}
.expand{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.expand.open{max-height:2000px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--text);}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;}
.btn.full{width:100%;}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;}
.btn.danger{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red);}
.fab{position:fixed;right:18px;bottom:calc(86px + var(--safe-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 50%,transparent);z-index:40;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(66px + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:stretch;z-index:35;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;padding-top:8px;}
.nav-item .ni{font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;height:22px;}
.nav-item .ni svg{width:23px;height:23px;display:block;}
.nav-item.active{color:var(--accent);}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-bg.show{opacity:1;pointer-events:auto;}
.modal{position:relative;background:var(--surface);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + var(--safe-bottom));max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.34,1.2,.5,1);}
.modal-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--surface2);color:var(--text);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:5;}
.modal-bg.show .modal{transform:none;}
.modal h2{font-size:19px;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
.field input,.field select{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg button{flex:1;padding:11px;border-radius:11px;background:var(--surface2);font-weight:700;font-size:13px;border:1.5px solid transparent;min-width:80px;}
.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(90px + var(--safe-bottom));background:var(--text);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:all .25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.editnum{width:92px;text-align:right;padding:8px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-weight:700;}
.switch{width:44px;height:26px;border-radius:999px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0;}
.switch.on{background:var(--green);}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
.switch.on::after{left:21px;}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;}
.notif{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(217,119,6,.35);}
.notif .t{font-weight:800;font-size:15px;}
.mini-hist{font-size:12px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--border);}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
.qtot{display:flex;justify-content:space-between;font-weight:800;padding-top:10px;border-top:2px solid var(--border);margin-top:6px;}
</style>
</head>

function migrate(){
  let ch=false;

  if(!DATA.accounts['Betterment']) DATA.accounts['Betterment']={balance:0,type:'checking',color:'#8b5cf6'};

  DATA.incomeHistory=DATA.incomeHistory.filter(x=>x.note!=='Ajuste ingreso auto');

    const bal=+DATA.accounts['Betterment'].balance||0;
    if(bal<-0.5){
      const falta=Math.round(-bal*100)/100, a=Math.round(falta/2*100)/100, b=Math.round((falta-a)*100)/100;
      DATA.incomeHistory.push({who:'luis',amount:a,date:'2026-08-28',note:'Ingreso recibido (ajuste)'});
      DATA.incomeHistory.push({who:'luis',amount:b,date:'2026-09-10',note:'Ingreso recibido (ajuste)'});
      DATA.accounts['Betterment'].balance=0; ch=true;
    }
    localStorage.setItem('fh_bett_zero_v2','1');
  }
  // v3: cargar la lista de fijos oficial del budget (una vez)
  if(!localStorage.getItem('fh_budget_v3')){
    FIXED = BUDGET.map(b=>({...b, group:groupOf(b.payTo), active:true}));
    saveFixed();
    localStorage.setItem('fh_budget_v3','1'); ch=true;
  } else {
    // asegurar campos
    FIXED.forEach(f=>{ if(!f.group){f.group=groupOf(f.payTo||'Wells Fargo');ch=true;} if(f.active===undefined){f.active=true;ch=true;} });
  }
  // AUTO-REPARAR: si la lista de fijos quedó vacía o en formato viejo (sin quincena 'q'), recargarla del budget.
  if(!FIXED || !FIXED.length || !FIXED.some(f=>f.q===15||f.q===30)){ FIXED = BUDGET.map(b=>({...b, group:groupOf(b.payTo), active:true})); saveFixed(); ch=true; }
  // v4: limpiar los fijos que se auto-generaron por error (duplicados como Netflix ya pagado)
  if(!localStorage.getItem('fh_clean_v4')){
    const before=DATA.transactions.length;
    DATA.transactions=DATA.transactions.filter(t=>t.note!=='Fijo tarjeta'&&t.note!=='Factura fija');
    if(DATA.transactions.length!==before) ch=true;
    localStorage.setItem('fh_clean_v4','1');
  }

  if(!localStorage.getItem('fh_fix_v8')){
    FIXED.forEach(f=>{ if(f.payTo==='Checking'){ f.payTo='Betterment'; f.group='bett'; ch=true; } });
    localStorage.setItem('fh_fix_v8','1');
  }
  // v9: Allowance Monica se aparta automático a su fondo el día 15 (antes Regions)
  if(!localStorage.getItem('fh_fix_v9')){
    const am=FIXED.find(f=>f.name==='Allowance Monica'); if(am){ am.payTo='Betterment'; am.group='bett'; am.day=15; am.q=15; ch=true; }
    if(!DATA.savings['Allowance Monica']){ DATA.savings['Allowance Monica']={monthly:100,total:0,color:'#f472b6',history:[]}; ch=true; }
    localStorage.setItem('fh_fix_v9','1');
  }
  // v10: dejar Betterment en $0 (ingreso = gasto) — quitar el negativo acumulado, una vez
  if(!localStorage.getItem('fh_zero_v10')){
    const bal=+DATA.accounts['Betterment'].balance||0;
    if(bal<-0.5){ _bl('Ajuste: ingreso igual a gasto', -bal); DATA.accounts['Betterment'].balance=0; ch=true; }
    localStorage.setItem('fh_zero_v10','1');
  }

    if(DATA.savings['Clothing']){ DATA.savings['Clothing'].monthly=0; ch=true; }

  // v12: fondo Joint Life Savings ($1851.45, +$100 los días 15 y 30 desde Regions, solo tracking)
  if(!localStorage.getItem('fh_fix_v12')){
    if(!DATA.savings['Joint Life Savings']){ DATA.savings['Joint Life Savings']={monthly:200,total:1851.45,color:'#2dd4bf',history:[{date:todayStr(),amount:1851.45,note:'Saldo inicial',src:'adj'}],auto:{amount:100,days:[15,30],source:'Regions'}}; ch=true; }
    localStorage.setItem('fh_fix_v12','1');
  }
  // v13: correcciones del presupuesto según el detalle real de Luis
  if(!localStorage.getItem('fh_fix_v13')){
    const F=(n,q)=>FIXED.find(f=>f.name===n && (q==null||f.q===q)); let x;
    x=F('Extra Expenses'); if(x){ x.payTo='Betterment'; x.group='bett'; x.noauto=true; x.day=15; x.q=15; } // buffer en Betterment para "Otros"
    FIXED.filter(f=>f.name==='Food & Essentials').forEach(f=>{ f.name='Food'; f.payTo='Betterment'; f.group='bett'; f.manual=true; }); // Food Reserve, depósito manual
    x=F('Mediacom'); if(x) x.amount=93;
    x=F('Water'); if(x) x.variable=true;
    x=F('Emergency Funds',30); if(x){ x.payTo='Betterment'; x.group='bett'; }
    x=F('Gas',30); if(x){ x.payTo='Betterment'; x.group='bett'; } // bucket Gas Reserve
    x=F('Rent'); if(x) x.amount=880;
    x=F('Offering'); if(x){ x.payTo='Wells Fargo'; x.group='card'; } // se paga desde Wells
    x=F('Ameren'); if(x) x.variable=true;
    x=F('Philipines')||F('Phillipines'); if(x) x.variable=true;
    // Food Reserve: depósito de quincena $600 manual
    if(DATA.savings['Food Reserve']){ DATA.savings['Food Reserve'].periodDeposit=600; }
    ch=true; localStorage.setItem('fh_fix_v13','1');
  }
  // v14: los apartados deben depender de la QUINCENA del ingreso, no del día del mes.
  // Revierte los apartados/pagos que se dispararon por error este mes (eran de la Q30 pero
  // solo se depositó para la Q15) y etiqueta el ingreso de este mes como Q15.
  if(!localStorage.getItem('fh_fix_v14')){
    const mk=monthOf(todayStr());
    // Solo aplica la reversión si los datos aún están en el estado "con bug" (ingreso del mes SIN
    // etiqueta de quincena). Si ya vienen corregidos (SEED nuevo / dispositivo ya arreglado), no toca nada.
    const buggy=DATA.incomeHistory.some(x=>monthOf(x.date)===mk && x.note!=='Ingreso recibido (ajuste)' && x.q==null);
    if(buggy){
    const pref=['Apartado: ','Pago fijo: '];
    const isAuto=e=>e&&e.desc&&pref.some(p=>e.desc.startsWith(p));
    (DATA.betLog||[]).forEach(e=>{
      if(monthOf(e.date)!==mk||!isAuto(e))return;
      DATA.accounts.Betterment.balance=(+DATA.accounts.Betterment.balance||0)-(+e.amount||0); // e.amount negativo → regresa el dinero
      const nm=e.desc.replace(/^(Apartado: |Pago fijo: )/,''); const bk=BUCKET_MAP[nm];
      if(bk&&DATA.savings[bk]){ DATA.savings[bk].total=(+DATA.savings[bk].total||0)+(+e.amount||0);
        const h=DATA.savings[bk].history||[]; const i=h.findIndex(x=>x.note==='Auto apartado'&&Math.abs((+x.amount||0)-(-(+e.amount||0)))<0.005); if(i>=0) h.splice(i,1); }
    });
    DATA.betLog=(DATA.betLog||[]).filter(e=>!(monthOf(e.date)===mk&&isAuto(e)));
    Object.keys(localStorage).filter(k=>k.startsWith('fh_auto_'+mk)||k.startsWith('fh_bkauto_'+mk)||k.startsWith('fh_man_'+mk)).forEach(k=>localStorage.removeItem(k));
    // etiqueta el ingreso real de este mes como Q15 (fue lo que depositó para la quincena del 15)
    DATA.incomeHistory.forEach(x=>{ if(monthOf(x.date)===mk && x.note!=='Ingreso recibido (ajuste)' && x.q==null) x.q=15; });
    ch=true;
    }
    localStorage.setItem('fh_fix_v14','1');
  }
  // v15: reglas de categoría iniciales para el importador (Luis puede editarlas en Ajustes)
  if(!localStorage.getItem('fh_rules_v15')){
    DATA.catRules=DATA.catRules||[];
    const seed=[['fuel','Gas'],['sih','Servicios Médicos'],['southern illinois health','Servicios Médicos'],['pharmacy','Servicios Médicos'],['walgreens','Servicios Médicos'],['cvs','Servicios Médicos'],['secretary of state','Otros'],['dmv','Otros']];
    seed.forEach(([kw,cat])=>{ if(!DATA.catRules.some(r=>r.kw===kw)) DATA.catRules.push({kw,cat}); });
    ch=true; localStorage.setItem('fh_rules_v15','1');
  }
  if(ch){ saveData(); saveFixed(); }
}
function groupOf(payTo){ if(payTo==='Betterment'||payTo==='Checking')return 'bett'; if(payTo==='Wells Fargo'||payTo==='WF')return 'card'; return 'aside'; }

/* ================= MOTOR DE DINERO ================= */
function bettBal(){ return +(DATA.accounts?.Betterment?.balance||0); }
function isCard(src){ return src==='Wells Fargo'||src==='WF'; }
function wfPending(){ return DATA.transactions.filter(t=>t.type!=='income'&&t.status!=='paid'&&(isCard(t.source)||!t.source)); }
function wfOwed(){ return wfPending().reduce((s,t)=>s+(+t.amount||0),0); }
function paySources(){ const b=Object.keys(DATA.savings||{}); const first=['Betterment','Food Reserve','Gas Reserve'].filter(x=>x==='Betterment'||b.includes(x)); const rest=b.filter(x=>!first.includes(x)); return [...first,...rest,'Regions']; }
function _bl(desc,amount){ (DATA.betLog=DATA.betLog||[]).push({date:todayStr(),desc,amount:Math.round(amount*100)/100}); }
function deductSource(src,amt,note){
  if(src==='Betterment'){ DATA.accounts.Betterment.balance=bettBal()-amt; _bl(note||'Gasto',-amt); return; }
  if(DATA.savings[src]){ const b=DATA.savings[src]; b.total=(+b.total||0)-amt; (b.history=b.history||[]).push({date:todayStr(),amount:-amt,note:note||'Pago'}); }
}
function addSource(src,amt,note){
  if(src==='Betterment'){ DATA.accounts.Betterment.balance=bettBal()+amt; _bl(note||'Ingreso',amt); return; }
  if(DATA.savings[src]){ const b=DATA.savings[src]; b.total=(+b.total||0)+amt; (b.history=b.history||[]).push({date:todayStr(),amount:amt,note:note||'Reverso'}); }
}
function savingsTotal(){ return Object.values(DATA.savings).reduce((s,b)=>s+(+b.total||0),0); }

// (Los gastos fijos NO se auto-generan como cargos. Tú registras tus compras reales en la Tarjeta.)
// Los aportes a fondos SÍ son automáticos: salen solos de Betterment cada quincena.
// La quincena de un ingreso: usa x.q si está, si no la deduce de la fecha (día<16 → Q15).
function incQ(x){ return x.q===30?30:x.q===15?15:(new Date((x.date||todayStr())+'T00:00:00').getDate()<16?15:30); }
// ¿Ya llegó un cheque REAL (no el ajuste) para esta quincena de este mes?
function qHasIncome(mk,q){ return DATA.incomeHistory.some(x=>monthOf(x.date)===mk && x.note!=='Ingreso recibido (ajuste)' && incQ(x)===q); }
// Buckets que ya reciben depósito vía un gasto fijo bett (para no duplicar con b.auto)
function fixedBucketSet(){ return new Set(FIXED.filter(f=>f.group==='bett').map(f=>BUCKET_MAP[f.name]).filter(Boolean)); }
function autoKey(mk,q,id){ return 'fh_auto_'+mk+'_'+q+'_'+id; }
// Día en que el apartado realmente SALE de Betterment (queda "en hold" hasta ese día).
function fillDay(f){ return Math.min(28,Math.max(1,+f.day||(f.q===30?30:15))); }
function bettAppliedThisMonth(mk){ return FIXED.filter(f=>f.active&&f.group==='bett'&&localStorage.getItem(autoKey(mk,f.q,f.id))); }
// "Por venir": apartados bett cuya quincena aún no recibe cheque (se apartarán cuando llegue).
function bettUpcoming(mk){ return FIXED.filter(f=>f.active&&f.group==='bett'&&!f.manual&&!f.noauto&&!localStorage.getItem(autoKey(mk,f.q,f.id))&&!qHasIncome(mk,f.q)); }
// "En hold": cheque de la quincena ya llegó, pero el apartado aún no sale (espera su día). Sigue en Betterment.
function bettScheduled(mk){ const cur=(mk===monthOf(todayStr())); const today=new Date().getDate(); const out=[];
  [15,30].forEach(q=>{ if(!qHasIncome(mk,q))return;
    FIXED.filter(f=>f.active&&f.group==='bett'&&f.q===q&&!f.manual&&!f.noauto).forEach(f=>{
      if(localStorage.getItem(autoKey(mk,q,f.id)))return; if(cur&&today>=fillDay(f))return; out.push(f); }); });
  return out; }
function bettReserved(mk){ return Math.round(bettScheduled(mk).reduce((s,f)=>s+(+f.amount||0),0)*100)/100; }
// Depósitos manuales (ej. Food) de quincenas con cheque, aún sin depositar.
function bettManualPending(mk){ let sum=0;
  [15,30].forEach(q=>{ if(!qHasIncome(mk,q))return;
    FIXED.filter(f=>f.active&&f.group==='bett'&&f.manual&&f.q===q&&!localStorage.getItem('fh_man_'+mk+'_'+f.id)).forEach(f=>sum+=(+f.amount||0)); });
  return Math.round(sum*100)/100; }
// Disponible real = efectivo − lo ya reservado (programado) − lo manual pendiente. Eso es tu "extra".
function bettAvailable(mk){ return Math.round((bettBal()-bettReserved(mk||monthOf(todayStr()))-bettManualPending(mk||monthOf(todayStr())))*100)/100; }
function autoTransferBuckets(){
  const mk=monthOf(todayStr()); const today=new Date().getDate(); let applied=[]; let changed=false;
  const fxBuckets=fixedBucketSet();
  // Apartados fijos que salen de Betterment: SOLO cuando (a) llegó el cheque de esa quincena
  // y (b) ya es su día. Antes de su día quedan "en hold" (siguen en Betterment).
  [15,30].forEach(q=>{
    if(!qHasIncome(mk,q)) return;
    FIXED.filter(f=>f.active&&f.group==='bett'&&f.q===q&&!f.manual&&!f.noauto).forEach(f=>{ const key=autoKey(mk,q,f.id); if(localStorage.getItem(key))return; if(today<fillDay(f))return;
      const amt=+f.amount||0; const bk=BUCKET_MAP[f.name];
      deductSource('Betterment',amt,(bk?'Apartado: ':'Pago fijo: ')+f.name);
      if(bk&&DATA.savings[bk]){ DATA.savings[bk].total=(+DATA.savings[bk].total||0)+amt; (DATA.savings[bk].history=DATA.savings[bk].history||[]).push({date:todayStr(),amount:amt,note:'Auto apartado'}); }
      localStorage.setItem(key,'1'); applied.push({id:f.id,name:f.name,amount:amt}); changed=true; });
  });
  // Aportes automáticos definidos en cada fondo (b.auto: {amount, days:[15,30], source}).
  // Se ignoran los buckets ya cubiertos por un gasto fijo (para no duplicar); típicamente solo
  // queda Joint Life Savings (Regions, tracking). Cada día se ata a su quincena y espera su día.
  Object.entries(DATA.savings).forEach(([bn,b])=>{ if(!b.auto||!(+b.auto.amount>0)||!Array.isArray(b.auto.days))return;
    if(fxBuckets.has(bn))return;
    const fromBett = b.auto.source==='Betterment';
    b.auto.days.forEach(d=>{ const q=(+d)<16?15:30; if(!qHasIncome(mk,q))return; if(today<(+d))return; const key='fh_bkauto_'+mk+'_'+q+'_'+bn.replace(/\W/g,'_'); if(localStorage.getItem(key))return;
      const amt=+b.auto.amount; b.total=(+b.total||0)+amt;
      (b.history=b.history||[]).push({date:todayStr(),amount:amt,note:'Auto '+(b.auto.source||'externo'),src:fromBett?'bett':'adj'});
      if(fromBett) deductSource('Betterment',amt,'Ahorro '+bn);
      localStorage.setItem(key,'1'); applied.push({name:bn,amount:amt}); changed=true; }); });
  if(changed) saveData();
  return applied;
}
// Quincena "actual": la del último cheque real de este mes; si no hay, por fecha.
function currentQ(){ const mk=monthOf(todayStr()); const inc=DATA.incomeHistory.filter(x=>monthOf(x.date)===mk&&x.note!=='Ingreso recibido (ajuste)'); if(inc.length) return incQ(inc[inc.length-1]); return new Date().getDate()<16?15:30; }
function bettPendingThisQ(){ const mk=monthOf(todayStr()); const q=currentQ(); let sum=0;
  FIXED.filter(f=>f.active&&f.group==='bett'&&f.q===q&&!f.noauto).forEach(f=>{ const done= f.manual? localStorage.getItem('fh_man_'+mk+'_'+f.id) : localStorage.getItem(autoKey(mk,q,f.id)); if(!done) sum+=(+f.amount||0); });
  return Math.round(sum*100)/100; }
function doManualDeposit(id){ const mk=monthOf(todayStr()); const f=FIXED.find(x=>x.id===id); if(!f)return; const key='fh_man_'+mk+'_'+id; if(localStorage.getItem(key)){toast('Ya depositado');return;}
  const amt=+f.amount||0; const bk=BUCKET_MAP[f.name];
  deductSource('Betterment',amt,'Depósito '+f.name);
  if(bk&&DATA.savings[bk]){ DATA.savings[bk].total=(+DATA.savings[bk].total||0)+amt; (DATA.savings[bk].history=DATA.savings[bk].history||[]).push({date:todayStr(),amount:amt,note:'Depósito quincena',src:'bett'}); }
  localStorage.setItem(key,'1'); saveData(); render(); toast('Depositado '+money(amt)); }
function undoAuto(id){ const mk=monthOf(todayStr()); const f=FIXED.find(x=>x.id===id); if(!f)return; const key=autoKey(mk,f.q,id); if(!localStorage.getItem(key))return;
  const amt=+f.amount||0; addSource('Betterment',amt,'Deshacer: '+f.name);
  const bk=BUCKET_MAP[f.name]; if(bk&&DATA.savings[bk]){ DATA.savings[bk].total=(+DATA.savings[bk].total||0)-amt; (DATA.savings[bk].history=DATA.savings[bk].history||[]).push({date:todayStr(),amount:-amt,note:'Deshacer'}); }
  localStorage.removeItem(key); saveData(); render(); toast('Deshecho'); }
// Reconstruye las banderas de "ya apartado" a partir del ledger (betLog). Evita que, al cargar
// un backup o el SEED (que ya traen los apartados descontados) SIN las banderas de localStorage,
// autoTransferBuckets vuelva a descontarlos por segunda vez.
function reconcileAutoFlags(){ const mk=monthOf(todayStr());
  const counts={}; (DATA.betLog||[]).forEach(e=>{ if(monthOf(e.date)!==mk)return; const m=/^(?:Apartado: |Pago fijo: )(.+)$/.exec(e.desc||''); if(m) counts[m[1]]=(counts[m[1]]||0)+1; });
  const used={}; [15,30].forEach(q=>{ FIXED.filter(f=>f.active&&f.group==='bett'&&f.q===q&&!f.manual&&!f.noauto).forEach(f=>{ const c=counts[f.name]||0,u=used[f.name]||0; if(u<c){ localStorage.setItem(autoKey(mk,q,f.id),'1'); used[f.name]=u+1; } }); });
  const mc={}; (DATA.betLog||[]).forEach(e=>{ if(monthOf(e.date)!==mk)return; const m=/^Depósito (.+)$/.exec(e.desc||''); if(m) mc[m[1]]=(mc[m[1]]||0)+1; });
  const mu={}; [15,30].forEach(q=>{ FIXED.filter(f=>f.active&&f.group==='bett'&&f.manual&&f.q===q).forEach(f=>{ const c=mc[f.name]||0,u=mu[f.name]||0; if(u<c){ localStorage.setItem('fh_man_'+mk+'_'+f.id,'1'); mu[f.name]=u+1; } }); });
  // aportes b.auto (ej. Joint Life): si ya están en el historial del bucket este mes, marca su bandera
  Object.entries(DATA.savings).forEach(([bn,b])=>{ if(!b.auto||!Array.isArray(b.auto.days))return; const done=(b.history||[]).filter(x=>monthOf(x.date)===mk&&/^Auto /.test(x.note||'')).length; let seen=0;
    b.auto.days.slice().sort((a,c)=>a-c).forEach(d=>{ if(seen<done){ const q=(+d)<16?15:30; localStorage.setItem('fh_bkauto_'+mk+'_'+q+'_'+bn.replace(/\W/g,'_'),'1'); seen++; } }); });
}
reconcileAutoFlags();
autoTransferBuckets();
function autoBackup(){ try{
  const today=todayStr();
  if(localStorage.getItem('fh_bak_last')===today) return;
  let list=[]; try{list=JSON.parse(localStorage.getItem('fh_bak_list')||'[]');}catch(e){}
  localStorage.setItem('fh_bak_'+today, JSON.stringify({date:new Date().toISOString(),data:DATA,cats:CATS,fixedPayments:FIXED}));
  list=list.filter(d=>d!==today); list.push(today);
  while(list.length>2){ const old=list.shift(); localStorage.removeItem('fh_bak_'+old); }
  localStorage.setItem('fh_bak_list', JSON.stringify(list));
  localStorage.setItem('fh_bak_last', today);
}catch(e){} }
autoBackup();

function doPay(ids){
  const groups={}; DATA.transactions.forEach(t=>{ if(ids.includes(t.id)&&t.status!=='paid'){ (groups[t.category]=groups[t.category]||[]).push(t); }});
  let totalPaid=0, count=0; const batch='pb'+Date.now(); const paidItems=[];
  Object.keys(groups).forEach(cat=>{
    const key=encodeURIComponent(cat);
    const src=document.querySelector('#modalBox select[data-src="'+key+'"]')?.value||'Betterment';
    const amt=+(document.querySelector('#modalBox input[data-amt="'+key+'"]')?.value)||0;
    if(amt<=0) return;
    const list=groups[cat].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    let acc=0;
    for(const t of list){ const v=+t.amount||0; if(acc+v<=amt+0.005){ t.status='paid'; t.paidDate=todayStr(); t.paySource=src; t.payBatch=batch; acc+=Math.round(v*100)/100; count++; paidItems.push({name:t.name||'(sin nombre)',category:cat,amount:v,source:src}); } else break; }
    if(acc>0){ deductSource(src,acc,'Pago '+cat); totalPaid+=acc; }
  });
  selPay.clear(); saveData(); closeModal(); render();
  if(count) showPaidSummary(paidItems,totalPaid); else toast('Nada pagado (monto muy bajo)');

let PRESU_SHOWALL=false;

function presuMatch(f){ return PRESU_SHOWALL ? true : !PRESU_HIDE.includes(f.payTo); }

function delBucketMove(name,idx){ const b=DATA.savings[name]; const x=b.history&&b.history[idx]; if(!x)return;
  if(!askC('¿Deshacer este movimiento ('+(x.amount>=0?'+':'')+money(x.amount)+')?'))return;
  b.total=(+b.total||0)-(+x.amount||0);
  const touchedBett = x.src? (x.src==='bett') : /Betterment/.test(x.note||'');
  if(touchedBett){ if(x.amount>0) addSource('Betterment',x.amount,'Reverso ahorro '+name); else deductSource('Betterment',-x.amount,'Reverso retiro '+name); }
  b.history.splice(idx,1); saveData(); render(); toast('Movimiento deshecho');

function saveBucketEdit(name){ const nn=$('#beN').value.trim(); if(!nn){toast('Ponle nombre');return;}

/* ============ IMPORTAR DEL ESTADO DE CUENTA (captura → gastos) ============ */
// Lee una imagen con OCR (Tesseract, se descarga solo al usarlo — no engorda tu archivo) o texto pegado,
// separa cada línea en fecha/nombre/monto, adivina la categoría, y te deja revisar/editar antes de guardar.
let IMPORT_ROWS=[];
function openImportModal(){
  modal(`<h2>📷 Importar del estado de cuenta</h2>
    <div class="small muted" style="margin-bottom:12px">Sube una captura o foto de tu estado de cuenta. La leo y te muestro los gastos para revisar y corregir antes de guardar. Entran como compras por pagar (tarjeta).</div>
    <div class="field"><label>Captura / foto</label><input id="impFile" type="file" accept="image/*" onchange="runImportOCR(this.files&&this.files[0])"></div>
    <div id="impStatus" class="small" style="min-height:18px;margin-bottom:6px;color:var(--muted)"></div>
    <div class="tiny muted" style="margin:10px 0 6px">o pega el texto (útil sin internet, o si la foto sale mal):</div>
    <textarea id="impText" rows="5" placeholder="Pega aquí las líneas del estado de cuenta" style="width:100%;padding:10px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-family:inherit"></textarea>
    <button class="btn full" style="margin-top:8px" onclick="importFromText()">Usar texto pegado</button>`);
}
function loadTesseract(){ return new Promise((res,rej)=>{ if(window.Tesseract)return res(); const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'; s.onload=()=>res(); s.onerror=()=>rej(new Error('load')); document.head.appendChild(s); }); }
async function runImportOCR(file){ if(!file)return; const box=$('#impStatus'); if(box)box.textContent='Cargando lector… (usa internet la primera vez)';
  try{ await loadTesseract(); }catch(e){ if(box)box.textContent='No se pudo cargar el lector. Conéctate a internet o pega el texto abajo.'; return; }
  if(box)box.textContent='Leyendo imagen…';
  try{ const {data}=await Tesseract.recognize(file,'spa+eng',{logger:m=>{ if(m.status==='recognizing text'&&box)box.textContent='Leyendo… '+Math.round((m.progress||0)*100)+'%'; }});
    const rows=parseStatement(data.text||'');
    if(!rows.length){ if(box)box.textContent='No detecté gastos. Prueba otra captura más nítida o pega el texto.'; return; }
    renderImportReview(rows);
  }catch(e){ if(box)box.textContent='Error leyendo la imagen. Mejor pega el texto.'; }
}
function importFromText(){ const t=($('#impText')?.value)||''; const rows=parseStatement(t); if(!rows.length){toast('No detecté gastos en el texto');return;} renderImportReview(rows); }
function guessCat(n){ n=(n||'').toLowerCase();
  // 1) Reglas aprendidas primero (la más específica/larga gana). Así "fuel" gana sobre "kroger".
  const rules=(DATA.catRules||[]).slice().sort((a,b)=>(b.kw||'').length-(a.kw||'').length);
  for(const r of rules){ if(r.kw && n.includes(r.kw.toLowerCase()) && CATS.some(c=>c.name===r.cat)) return r.cat; }
  // 2) Palabras clave de fábrica
  const has=a=>a.some(k=>n.includes(k));
  if(has(['shell','huck','circle k','circle-k','bp ','exxon','mobil','murphy','casey','fuel','chevron','marathon','phillips 66']))return 'Gas';
  if(has(['walmart','wal-mart','wal mart','wm supercenter','kroger','aldi','sam','costco','doordash','uber eat','ubereats','mcdonald','starbuck','restaurant','grocery','target','dollar','food','cafe','pizza','taco','wendy','chipotle','subway','panera','deli','market','bakery','schnucks','hy-vee']))return 'Supermercado & Salidas';
  if(has(['netflix','spotify','at&t','att ','mediacom','ameren','insurance','geico','progressive','mint','disney','hulu','gym','apple.com','apple ','google','amazon prime','prime video','hbo','max ','paramount']))return 'Facturas';
  return 'Otros';
}
// clave sugerida para "recordar" (primer token significativo del comercio)
function ruleKeyFrom(name){ const skip=new Set(['sq','tst','pos','pp','sp','pmt','pmnt','ach','paypal','purchase','pending','posted','the','llc','inc']);
  const clean=(name||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/);
  const toks=clean.filter(w=>w.length>=3&&!/^\d+$/.test(w)&&!skip.has(w));
  if(toks.length) return toks[0];
  const all=clean.filter(w=>w.length>=2&&!/^\d+$/.test(w)&&!skip.has(w)); return (all.sort((a,b)=>b.length-a.length)[0]||'').trim(); }
function addCatRule(kw,cat){ kw=(kw||'').trim().toLowerCase(); if(!kw||!cat)return false; DATA.catRules=DATA.catRules||[];
  const ex=DATA.catRules.find(r=>r.kw===kw); if(ex)ex.cat=cat; else DATA.catRules.push({kw,cat}); return true; }
function parseStatement(text){ const yr=todayStr().slice(0,4); const lines=(text||'').split(/\r?\n+/).map(l=>l.trim()).filter(l=>l.length>2); const rows=[]; const seen={};
  // índice de gastos existentes por fecha+monto (para detectar duplicados)
  const existing={}; DATA.transactions.forEach(t=>{ if(t.type==='income')return; const k=(t.date||'')+'|'+(Math.round((+t.amount||0)*100)/100); existing[k]=(existing[k]||0)+1; });
  lines.forEach(l=>{ const amts=l.match(/[+\-]?\(?\$?\s?\d{1,3}(?:,\d{3})*\.\d{2}\)?/g); if(!amts)return;
    const raw=amts[amts.length-1]; const amt=parseFloat(raw.replace(/[^0-9.]/g,'')); if(!isFinite(amt)||amt<=0)return;
    // crédito/abono/reembolso: "+" al frente, paréntesis, signo -, o palabras clave (verde en el banco = te devolvieron)
    const credit=/^[+(]/.test(raw.trim())||/^-/.test(raw.trim())||/\bpago\b|\bpayment\b|\bcredit|\bdeposit|\brefund|\breturn|abono|reembolso/i.test(l);
    let name=l; amts.forEach(a=>{ name=name.replace(a,' '); });
    let date=todayStr(); const dm=l.match(/\b(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?\b/);
    if(dm){ const mo=+dm[1],da=+dm[2]; let y=dm[3]?(+dm[3]<100?2000+ +dm[3]:+dm[3]):+yr; if(mo>=1&&mo<=12&&da>=1&&da<=31){ date=y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0'); name=name.replace(dm[0],' '); } }
    name=name.replace(/\s{2,}/g,' ').replace(/^[\s\-–|:.#]+|[\s\-–|:.]+$/g,'').trim();
    name=name.replace(/^(pending|posted|pendiente|purchase|compra|debit|pos)\s+/i,'').trim();
    if(name.length>44)name=name.slice(0,44).trim(); if(!name)name='(sin nombre)';
    const cents=Math.round(amt*100)/100; const k=date+'|'+cents;
    // duplicado: misma fecha+monto ya existe en tus gastos, o repetido dentro de esta misma captura
    const dup=(existing[k]>0)||(seen[k]>0); seen[k]=(seen[k]||0)+1;
    rows.push({date,name,amount:cents,category:guessCat(name),credit,dup}); });
  return rows;
}
function renderImportReview(rows){ IMPORT_ROWS=rows;
  const nDup=rows.filter(r=>r.dup).length, nCred=rows.filter(r=>r.credit).length;
  let h=`<h2>Revisar gastos (${rows.length})</h2><div class="small muted" style="margin-bottom:10px">Corrige lo que salió mal y destilda lo que no quieras. Ya vienen destildados los abonos${nCred?' ('+nCred+')':''} y los posibles duplicados${nDup?' ('+nDup+')':''}. Marca "recordar" para que aprenda la categoría del comercio.</div><div style="max-height:50vh;overflow:auto">`;
  rows.forEach((r,i)=>{ const off=r.credit||r.dup; const key=ruleKeyFrom(r.name);
    h+=`<div class="card" style="box-shadow:none;background:var(--surface2);padding:10px;margin-bottom:8px">
    <div class="row" style="gap:8px;align-items:center;margin-bottom:6px"><div class="chk ${off?'':'on'}" id="imChk${i}" onclick="this.classList.toggle('on')">${off?'':'✓'}</div>
      <input id="imN${i}" value="${(r.name||'').replace(/"/g,'&quot;')}" style="flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text)">${r.credit?'<span class="badge paused">abono</span>':''}${r.dup?'<span class="badge card">dup</span>':''}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <input id="imA${i}" type="text" inputmode="numeric" value="${r.amount.toFixed(2)}" oninput="centsInput(this)" style="width:88px;padding:8px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-weight:700">
      <select id="imC${i}" style="flex:1;min-width:130px;padding:8px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text)">${CATS.map(c=>`<option ${c.name===r.category?'selected':''}>${c.icon} ${c.name}</option>`).join('')}</select>
      <input id="imD${i}" type="date" value="${r.date}" style="flex:1;min-width:130px;padding:8px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text)">
    </div>
    ${key?`<label class="row tiny muted" style="gap:6px;margin-top:7px;cursor:pointer"><input type="checkbox" id="imR${i}" style="width:auto"> recordar «<b id="imRk${i}">${key}</b>» → esta categoría</label>`:''}
    </div>`; });
  h+=`</div><button class="btn primary full" style="margin-top:10px" onclick="commitImport()">Agregar seleccionados</button>`;
  modal(h);
}
function commitImport(){ let n=0, learned=0; const logItems=[];
  IMPORT_ROWS.forEach((r,i)=>{ if(!$('#imChk'+i)?.classList.contains('on'))return; const amount=+($('#imA'+i)?.value)||0; if(!amount)return;
    const name=($('#imN'+i)?.value||'').trim()||'(sin nombre)'; const category=($('#imC'+i)?.value||'').replace(/^[^\s]+\s/,''); const date=$('#imD'+i)?.value||todayStr();
    DATA.transactions.push({id:uid(),name,amount,category,source:'Wells Fargo',date,type:'expense',status:'pending',paidDate:null,paySource:null,note:'Importado'}); n++;
    logItems.push({date,name,amount,category});
    if($('#imR'+i)?.checked){ const kw=($('#imRk'+i)?.textContent||ruleKeyFrom(name)); if(addCatRule(kw,category))learned++; }
  });
  if(n){ DATA.importLog=DATA.importLog||[]; DATA.importLog.unshift({id:uid(),at:new Date().toISOString(),count:n,total:Math.round(logItems.reduce((s,x)=>s+x.amount,0)*100)/100,items:logItems});
    DATA.importLog=DATA.importLog.filter(e=>{ const d=(e.at||'').slice(0,10); return d && (Date.now()-new Date(d+'T00:00:00').getTime())<32*864e5; }); }
  IMPORT_ROWS=[]; saveData(); closeModal(); render();
  const msg = n ? ('Agregados '+n+' gastos'+(learned?(' · '+learned+' reglas aprendidas'):'')) : 'Nada agregado';
  toast(msg);
}
// Reglas de categoría aprendidas: si el nombre del comercio CONTIENE la palabra, usa esa categoría.
function openRules(){ const rules=(DATA.catRules||[]).slice().sort((a,b)=>(a.kw||'').localeCompare(b.kw||''));
  let h=`<h2>🏷️ Reglas de categorías</h2><div class="small muted" style="margin-bottom:10px">Si el nombre del gasto contiene esa palabra, se pone esa categoría al importar. La palabra más larga gana (ej. «fuel» gana sobre «kroger», así "Kroger Fuel" = Gas pero "Kroger" solo = Supermercado).</div>`;
  h+=`<div class="card" style="box-shadow:none;background:var(--surface2);padding:8px 12px">`;
  if(!rules.length) h+=`<div class="empty">Aún sin reglas. Agrega una abajo o marca "recordar" al importar.</div>`;
  rules.forEach(r=>{ const idx=DATA.catRules.indexOf(r); h+=`<div class="lrow"><div style="flex:1"><div class="nm small">«${r.kw}»</div></div>
    <select onchange="updRule(${idx},this.value)" style="max-width:52%;padding:7px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--text)">${CATS.map(c=>`<option ${c.name===r.cat?'selected':''}>${c.icon} ${c.name}</option>`).join('')}</select>
    <button class="btn sm" style="margin-left:8px" onclick="delRule(${idx})">🗑️</button></div>`; });
  h+=`</div>
    <div class="section-title" style="margin-left:0">Agregar regla</div>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      <input id="nrKw" placeholder="palabra (ej. fuel, sih)" style="flex:1;min-width:130px;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text)">
      <select id="nrCat" style="flex:1;min-width:130px;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text)">${CATS.map(c=>`<option>${c.icon} ${c.name}</option>`).join('')}</select>
    </div>
    <button class="btn primary full" style="margin-top:10px" onclick="saveNewRule()">Agregar regla</button>`;
  modal(h);
}
function updRule(idx,val){ if(!DATA.catRules[idx])return; DATA.catRules[idx].cat=val.replace(/^[^\s]+\s/,''); saveData(); toast('Regla actualizada'); }
function delRule(idx){ DATA.catRules.splice(idx,1); saveData(); openRules(); }
function saveNewRule(){ const kw=($('#nrKw')?.value||'').trim(); const cat=($('#nrCat')?.value||'').replace(/^[^\s]+\s/,''); if(!kw){toast('Escribe una palabra');return;} addCatRule(kw,cat); saveData(); openRules(); toast('Regla agregada'); }
// Historial de importaciones (se conserva ~1 mes y luego se borra solo)
function openImportLog(){ const log=(DATA.importLog||[]);
  let h=`<h2>📥 Historial de importaciones</h2><div class="small muted" style="margin-bottom:10px">Lo que has importado del banco en el último mes (se borra solo después). Sirve para verificar qué metiste.</div>`;
  if(!log.length){ h+=`<div class="card"><div class="empty">Aún no has importado nada.</div></div>`; modal(h); return; }
  log.forEach(e=>{ const dl=new Date(e.at).toLocaleDateString(LANG,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    h+=`<div class="card" style="padding:0;overflow:hidden"><div class="row" style="padding:12px 14px;cursor:pointer" onclick="toggleCat(this)">
      <div class="ico" style="background:var(--accent)22;color:var(--accent)">📥</div>
      <div style="flex:1"><div class="nm small">${dl}</div><div class="sub">${e.count} gastos</div></div>
      <div style="text-align:right"><div class="amt">${money(e.total)}</div></div><div style="margin-left:8px;color:var(--muted)" class="arrow">▾</div></div>
      <div class="expand"><div style="padding:0 14px 8px">`;
    (e.items||[]).forEach(it=>{ h+=`<div class="lrow"><div style="flex:1"><div class="nm small">${it.name}</div><div class="sub">${it.category} · ${it.date}</div></div><div class="amt small">${money(it.amount)}</div></div>`; });
    h+=`</div></div></div>`; });
  modal(h);
}

/* ================= AJUSTES ================= */

  modal(`<h2>Ajustes</h2>
    <div class="field"><label>Tema</label><div class="seg" id="setTheme">
      <button class="${PREFS.theme==='light'?'on':''}" data-v="light" onclick="setTheme('light')">☀️ Claro</button>
      <button class="${PREFS.theme==='dark'?'on':''}" data-v="dark" onclick="setTheme('dark')">🌙 Oscuro</button></div></div>
    <div class="field"><label>Idioma / Language</label><div class="seg" id="setLang">
      <button class="${LANG==='es'?'on':''}" data-v="es" onclick="setLang('es')">Español</button>
      <button class="${LANG==='en'?'on':''}" data-v="en" onclick="setLang('en')">English</button></div></div>
    <button class="btn full" style="margin-bottom:8px" onclick="openDatabase()">🗂️ Base de datos de gastos</button>
    <button class="btn full" style="margin-bottom:8px" onclick="openRules()">🏷️ Reglas de categorías (aprendidas)</button>
    <button class="btn full" style="margin-bottom:14px" onclick="openImportLog()">📥 Historial de importaciones (último mes)</button>
    <div class="field"><label>Meta semanal de Supermercado & Salidas</label><input class="editnum" style="width:120px" type="number" value="${+(DATA.weeklyGrocery||300)}" onchange="setWeeklyGoal(this.value)"></div>
    <div class="section-title" style="margin-left:0">Presupuestos por categoría</div>
    <div class="card" style="box-shadow:none;background:var(--surface2)">
    ${CATS.map(c=>`<div class="lrow"><div class="ico" style="background:${c.color}22;color:${c.color}">${c.icon}</div><div style="flex:1"><div class="nm small">${c.name}</div></div><input class="editnum" type="number" value="${DATA.budgetsDefault[c.name]||0}" onchange="setBudget(${JSON.stringify(c.name)},this.value)"></div>`).join('')}</div>
    <div class="section-title" style="margin-left:0">Categorías</div>
    <div class="card" style="box-shadow:none;background:var(--surface2)">
    ${CATS.map((c,i)=>`<div class="lrow"><div class="ico" style="background:${c.color}22;color:${c.color}">${c.icon}</div><div style="flex:1" onclick="openCatModal(${i})"><div class="nm small">${c.name}</div><div class="sub">Toca para editar</div></div><button class="btn sm" onclick="openCatModal(${i})">✏️</button></div>`).join('')}</div>
    <button class="btn full" onclick="openCatModal()">+ Nueva categoría</button>
    <div class="section-title" style="margin-left:0">Tarjeta Wells — límite</div>
    <div class="card" style="box-shadow:none;background:var(--surface2)">
      <div class="lrow"><div style="flex:1"><div class="nm small">Límite total</div></div><input class="editnum" type="number" value="${DATA.accounts['Wells Fargo']?.limit||0}" onchange="setWFLimit('limit',this.value)"></div>
      <div class="lrow"><div style="flex:1"><div class="nm small">Tu tope (self)</div></div><input class="editnum" type="number" value="${DATA.accounts['Wells Fargo']?.selfLimit||0}" onchange="setWFLimit('selfLimit',this.value)"></div></div>
    <div class="section-title" style="margin-left:0">Respaldo</div>
    <button class="btn full" onclick="exportBackup()">⬇️ Descargar respaldo</button>
    <label class="btn full" style="margin-top:8px;display:flex">⬆️ Importar respaldo<input type="file" accept="application/json" style="display:none" onchange="importBackup(event)"></label>
    ${(typeof SEED!=='undefined'&&SEED)?`<button class="btn full" style="margin-top:8px" onclick="restoreSeed()">♻️ Restaurar mis datos (respaldo 8 sep)</button>`:''}
    ${(localStorage.getItem('fh_last_export')?`<div class="tiny muted" style="text-align:center;margin-top:8px">Último respaldo descargado: ${localStorage.getItem('fh_last_export')}</div>`:`<div class="tiny warn" style="text-align:center;margin-top:8px">Aún no has descargado un respaldo. Hazlo de vez en cuando.</div>`)}
    ${(()=>{ let l=[]; try{l=JSON.parse(localStorage.getItem('fh_bak_list')||'[]');}catch(e){} return l.length?`<div class="section-title" style="margin-left:0">Respaldos automáticos (dentro de la app)</div><div class="card" style="box-shadow:none;background:var(--surface2)">${l.slice().reverse().map(d=>`<div class="lrow"><div style="flex:1"><div class="nm small">📅 ${d}</div></div><button class="btn sm" onclick="restoreBak('${d}')">Restaurar</button></div>`).join('')}</div>`:''; })()}
    <div class="tiny muted" style="text-align:center;margin-top:10px">NestFlow · datos en este dispositivo</div>`);
}
function setTheme(t){ PREFS.theme=t; savePrefs(); applyTheme(); document.querySelectorAll('#setTheme button').forEach(b=>b.classList.toggle('on',b.dataset.v===t)); }
function setLang(l){ LANG=(l==='en')?'en':'es'; PREFS.lang=LANG; savePrefs(); closeModal(); render(); openSettings(); toast(LANG==='en'?'Language: English':'Idioma: Español'); }
function setBudget(c,v){ DATA.budgetsDefault[c]=+v||0; saveData(); render(); }
function setWFLimit(k,v){ if(!DATA.accounts['Wells Fargo'])DATA.accounts['Wells Fargo']={type:'credit',balance:0}; DATA.accounts['Wells Fargo'][k]=+v||0; saveData(); render(); toast('Guardado'); }
function setWeeklyGoal(v){ DATA.weeklyGrocery=+v||0; saveData(); render(); toast('Meta semanal guardada'); }
function dbRows(list){ return list.map(t=>{ const ci=catInfo(t.category); return `<div class="lrow" onclick='openTxModal(${JSON.stringify(t.id)})'><div class="ico" style="background:${ci.color}22;color:${ci.color}">${ci.icon}</div><div style="flex:1"><div class="nm small">${t.name||'(sin nombre)'} ${t.status!=='paid'?'<span class="badge paused">pend.</span>':''}</div><div class="sub">${t.date||''} · ${t.category||''}${t.paySource?(' · '+t.paySource):''}</div></div><div class="amt small">${money(+t.amount)}</div></div>`; }).join('')||'<div class="empty">Nada.</div>'; }
function openDatabase(){ const list=DATA.transactions.filter(t=>t.type!=='income').slice().reverse().slice(0,300);
  modal(`<h2>Base de datos de gastos</h2>
    <div class="small muted" style="margin-bottom:10px">Del último que agregaste hacia abajo. Toca uno para revisar, editar o borrar.</div>
    <input id="dbSearch" placeholder="Buscar por nombre, categoría o fecha…" oninput="filterDB()" style="width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text);margin-bottom:10px">
    <div id="dbList">${dbRows(list)}</div>`);
}
function filterDB(){ const q=($('#dbSearch').value||'').toLowerCase(); const list=DATA.transactions.filter(t=>t.type!=='income'&&((t.name||'').toLowerCase().includes(q)||(t.category||'').toLowerCase().includes(q)||(t.date||'').includes(q))).slice().reverse().slice(0,300); $('#dbList').innerHTML=dbRows(list); }
function applyTheme(){ document.documentElement.setAttribute('data-theme',PREFS.theme); const m=document.querySelector('meta[name=theme-color]'); if(m)m.content=PREFS.theme==='dark'?'#0f0f13':'#f4f5f7'; }
const CAT_COLORS=['#7c6fcd','#60a5fa','#3ecf8e','#fbbf24','#f472b6','#2dd4bf','#fb923c','#84cc16','#f87171','#a78bfa'];
function openCatModal(i){ const ed=i!=null; const c=ed?CATS[i]:{name:'',color:CAT_COLORS[CATS.length%CAT_COLORS.length],icon:'📦'};
  modal(`<h2>${ed?'Editar':'Nueva'} categoría</h2><div class="field"><label>Nombre</label><input id="ctN" value="${c.name}"></div><div class="field"><label>Ícono (emoji)</label><input id="ctI" value="${c.icon}" maxlength="2"></div><div class="field"><label>Color</label><input id="ctC" type="color" value="${c.color}" style="height:46px;padding:4px"></div><button class="btn primary full" onclick="saveCat(${ed?i:-1})">Guardar</button>${ed?`<button class="btn danger full" style="margin-top:8px" onclick="delCat(${i})">Eliminar</button>`:''}`); }
function saveCat(i){ const name=$('#ctN').value.trim(); if(!name){toast('Ponle nombre');return;} const icon=$('#ctI').value.trim()||'📦', color=$('#ctC').value;
  if(i>=0){ const old=CATS[i].name; CATS[i]={name,color,icon}; if(old!==name){ DATA.transactions.forEach(t=>{if(t.category===old)t.category=name;}); if(DATA.budgetsDefault[old]!=null){DATA.budgetsDefault[name]=DATA.budgetsDefault[old];delete DATA.budgetsDefault[old];} saveData(); } }
  else CATS.push({name,color,icon});
  saveCats(); closeModal(); openSettings(); render(); toast('Guardado'); }
function delCat(i){ const c=CATS[i]; if(DATA.transactions.some(t=>t.category===c.name)){ if(!askC('Hay gastos en "'+c.name+'". ¿Eliminar de todos modos?'))return; } else if(!askC('¿Eliminar "'+c.name+'"?'))return; CATS.splice(i,1); saveCats(); closeModal(); openSettings(); render(); toast('Eliminada'); }
function exportBackup(){ const blob=new Blob([JSON.stringify({version:'7.0',exportDate:new Date().toISOString(),data:DATA,cats:CATS,fixedPayments:FIXED,prefs:PREFS},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='NestFlow-backup-'+todayStr()+'.json'; a.click(); localStorage.setItem('fh_last_export',todayStr()); toast('Respaldo descargado'); }
function restoreBak(date){ try{ const s=JSON.parse(localStorage.getItem('fh_bak_'+date)); if(!s){toast('No existe');return;} if(!askC('¿Restaurar el respaldo automático del '+date+'? Reemplaza los datos actuales.'))return;
  DATA=s.data; CATS=s.cats; FIXED=s.fixedPayments;
  DATA.transactions=DATA.transactions||[]; DATA.savings=DATA.savings||{}; DATA.incomeHistory=DATA.incomeHistory||[]; DATA.accounts=DATA.accounts||{}; DATA.budgetsDefault=DATA.budgetsDefault||{}; DATA.betLog=DATA.betLog||[];
  saveData();saveCats();saveFixed(); applyTheme(); closeModal(); render(); toast('Restaurado del '+date); }catch(e){toast('Error al restaurar');} }
function restoreSeed(){ if(typeof SEED==='undefined'||!SEED){toast('No hay respaldo embebido');return;}
  if(!askC('¿Restaurar tus datos del respaldo del 8 de septiembre? Se reemplazan los datos actuales de la app.'))return;
  DATA=clone(SEED.data); CATS=clone(SEED.cats); FIXED=clone(SEED.fixedPayments);
  ['fh_bett_zero_v2','fh_budget_v3','fh_clean_v4'].forEach(k=>localStorage.removeItem(k));
  Object.keys(localStorage).filter(k=>k.startsWith('fh_auto_')||k.startsWith('fh_bkauto_')||k.startsWith('fh_man_')).forEach(k=>localStorage.removeItem(k));
  DATA.transactions=DATA.transactions||[]; DATA.savings=DATA.savings||{}; DATA.incomeHistory=DATA.incomeHistory||[]; DATA.accounts=DATA.accounts||{}; DATA.budgetsDefault=DATA.budgetsDefault||{}; DATA.betLog=DATA.betLog||[];
  saveData(); saveCats(); saveFixed();
  migrate(); reconcileAutoFlags(); autoTransferBuckets(); applyTheme(); closeModal(); render(); toast('Datos restaurados ✓'); }
function importBackup(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=ev=>{ try{ const b=JSON.parse(ev.target.result);
  if(b.data){ DATA=b.data; DATA.transactions=DATA.transactions||[]; DATA.savings=DATA.savings||{}; DATA.incomeHistory=DATA.incomeHistory||[]; DATA.accounts=DATA.accounts||{}; DATA.budgetsDefault=DATA.budgetsDefault||{}; DATA.betLog=DATA.betLog||[]; saveData(); }
  if(b.cats){CATS=b.cats;saveCats();} if(b.fixedPayments){FIXED=b.fixedPayments;saveFixed();} if(b.prefs){PREFS=Object.assign(PREFS,b.prefs);savePrefs();}
  migrate(); applyTheme(); closeModal(); render(); toast('Importado ✓'); }catch(err){ alert('Archivo inválido'); } }; r.readAsText(f); }

/* ---------- Month picker ---------- */
function openMonthPicker(){ const months=[...new Set(DATA.transactions.map(t=>monthOf(t.date)).concat(DATA.incomeHistory.map(x=>monthOf(x.date))).concat([monthOf(todayStr())]))].filter(Boolean).sort().reverse();
  modal(`<h2>Ver mes</h2>${months.map(m=>`<button class="btn full ${m===VIEW_MONTH?'primary':''}" style="margin-bottom:8px" onclick="setMonth('${m}')">${new Date(m+'-01T00:00:00').toLocaleDateString(LANG,{month:'long',year:'numeric'})}</button>`).join('')}`); }
function setMonth(m){ VIEW_MONTH=m; closeModal(); render(); }

function modal(html){ $('#modalBox').innerHTML='<button class="modal-x" onclick="closeModal()" aria-label="Cerrar">✕</button>'+L(html); $('#modalBg').classList.add('show'); }
function closeModal(){ $('#modalBg').classList.remove('show'); }
function pick(group,el){ document.querySelectorAll('#'+group+' button').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }

applyTheme(); render();
</script>
</body>
</html>
